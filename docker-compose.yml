services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:8080"
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      NEWS_API_URL: ${NEWS_API_URL:-http://host.docker.internal:8082}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"

