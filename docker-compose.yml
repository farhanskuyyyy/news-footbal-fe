services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:8080"
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # Reach the backend directly by its container name over the shared docker
      # network (hardcoded so it overrides any NEWS_API_URL in .env used for
      # local `artisan serve`). 8080 = backend's internal listen port.
      NEWS_API_URL: http://apigo-docker-app-1:8080
      RABBITMQ_HOST: ${RABBITMQ_HOST:-host.docker.internal}
      # Shared Postgres (same DB as the Go backend) for persistent auth/users.
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-newsdb}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - shared

networks:
  shared:
    external: true
    name: apigo-docker_default
